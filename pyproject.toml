[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendorlens"
version = "0.1.0"
description = "Evidence-driven project proposal and vendor review platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "chromadb==1.5.9",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.1,<6",
  "rank-bm25>=0.2.2,<1",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=5.1,<6"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
vendorlens-backend-demo = "vendorlens.backend_demo:main"
vendorlens-recover = "vendorlens.recovery:main"
vendorlens-eval-retrieval = "vendorlens.eval_cli:main"
vendorlens-model-smoke = "vendorlens.model_smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
