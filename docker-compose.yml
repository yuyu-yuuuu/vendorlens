name: vendorlens

x-runtime-environment: &runtime-environment
  VENDORLENS_DATABASE_URL: postgresql+psycopg://vendorlens:${VENDORLENS_POSTGRES_PASSWORD:?Run python3 scripts/setup_local_env.py first}@postgres:5432/vendorlens
  VENDORLENS_REDIS_URL: redis://:${VENDORLENS_REDIS_PASSWORD:?Run python3 scripts/setup_local_env.py first}@redis:6379/0
  VENDORLENS_CHROMA_URL: http://chroma:8000
  VENDORLENS_STORAGE_ROOT: /data/files
  VENDORLENS_ENVIRONMENT: production
  VENDORLENS_API_ACCESS_KEY: ${VENDORLENS_API_ACCESS_KEY:?Run python3 scripts/setup_local_env.py first}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vendorlens
      POSTGRES_USER: vendorlens
      POSTGRES_PASSWORD: ${VENDORLENS_POSTGRES_PASSWORD:?Run python3 scripts/setup_local_env.py first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorlens -d vendorlens"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: ${VENDORLENS_REDIS_PASSWORD:?Run python3 scripts/setup_local_env.py first}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"']
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis_data:/data"]

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; printf \"GET /api/v2/auth/identity HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["127.0.0.1:8100:8000"]
    volumes: ["chroma_data:/data"]

  api:
    environment: *runtime-environment
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "vendorlens.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - files_data:/data/files
      - ./skills:/app/skills:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}

  worker:
    environment: *runtime-environment
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "vendorlens.worker"]
    volumes:
      - files_data:/data/files
      - ./skills:/app/skills:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}

  recovery:
    environment: *runtime-environment
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "vendorlens.recovery", "--watch"]
    volumes:
      - files_data:/data/files
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  files_data:
